spring:
  application:
    name: fynd-api

  datasource:
    url: jdbc:mysql://localhost:3306/fynd_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect